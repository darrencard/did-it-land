[project]
name = "did-it-land"
version = "0.3.6"
description = "A Claude skill that reads each shipped bet against its landing brief and calls landed, watch or stalled."
requires-python = ">=3.11"
# Standard library only, on purpose: the scripts run inside sandboxes that cannot install packages.
dependencies = []

[tool.ruff]
line-length = 180
target-version = "py311"
# Copied unchanged from the Leader Report at a pinned commit (VENDORED.json); linted there, never edited here.
extend-exclude = ["skills/did-it-land/scripts/vendor"]

[tool.ruff.lint]
# E, F: errors and unused names. I: import order. B: likely bugs. UP: old syntax.
# SIM: needless complexity. S: security (bandit).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests run the CLI with subprocess on fixed arguments.
"evals/**" = ["S603", "S101"]
# Vendored unchanged from the landing-brief skill, which targets Python 3.9.
"skills/did-it-land/scripts/landing_brief.py" = ["UP"]
# The page's CSS and plain-words tables read best one rule or entry per line.
"skills/did-it-land/scripts/render_html.py" = ["E501"]
